services:
  backend:
    image: ghcr.io/bullionbear/cpanel-backend:latest
    container_name: cpanel-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - DISCORD_REQUIRED_ROLE_ID=${DISCORD_REQUIRED_ROLE_ID:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`capi.${DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8186"
    pull_policy: always
    networks:
      - web_proxy

  frontend:
    image: ghcr.io/bullionbear/cpanel-frontend:latest
    container_name: cpanel-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`cpanel.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    pull_policy: always
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
