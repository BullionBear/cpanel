services:
  backend:
    image: ghcr.io/bullionbear/cpanel-backend:latest
    container_name: cpanel-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
    labels:
      - "traefik.enable=true"
      # Main router: no Authelia — API tokens must reach the backend unimpeded
      - "traefik.http.routers.backend.rule=Host(`capi.${DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8186"
      # Session router: Authelia-gated — browser exchanges cookie for JWT here
      - "traefik.http.routers.backend-session.rule=Host(`capi.${DOMAIN}`) && Path(`/api/v2/auth/session`)"
      - "traefik.http.routers.backend-session.entrypoints=websecure"
      - "traefik.http.routers.backend-session.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-session.service=backend"
      - "traefik.http.routers.backend-session.middlewares=authelia@docker"
      - "traefik.http.routers.backend-session.priority=10"
    pull_policy: always
    networks:
      - web_proxy

  frontend:
    image: ghcr.io/bullionbear/cpanel-frontend:latest
    container_name: cpanel-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`cpanel.${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=authelia@docker"
    pull_policy: always
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
