# Local Postgres 17 for development (C2-02). `make dev-db` starts it.
# Tests use internal/platform/pgtest and do not connect here.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cpanel
      POSTGRES_PASSWORD: cpanel
      POSTGRES_DB: cpanel
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpanel -d cpanel"]
      interval: 2s
      timeout: 3s
      retries: 20
