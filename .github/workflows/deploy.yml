name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main

env:
  SERVER_HOST: 172.237.19.123
  SERVER_USER: root
  DEPLOY_PATH: /root/cpanel/deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync deployment config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment/docker-compose.yml,deployment/README.md"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy to production server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_PATH }}
            source env.sh
            export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-cpanel}"
            echo "Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u yitech --password-stdin
            echo "Pulling latest images..."
            # Fail the job if GHCR pull is denied — otherwise we silently
            # "deploy" stale local images and Discord reports success.
            docker compose -p "$COMPOSE_PROJECT_NAME" pull backend frontend
            echo "Restarting services..."
            COMPOSE_PULL_POLICY=never docker compose -p "$COMPOSE_PROJECT_NAME" up -d --pull never --remove-orphans backend frontend
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Deployment completed successfully!"

      - name: Send Discord notification (Success)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "[\`${COMMIT_SHA}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg message "${COMMIT_MESSAGE:0:1000}" \
            --arg actor "$ACTOR" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: "✅ Deployment Successful",
              description: "CPanel has been deployed to production.",
              color: 3066993,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Branch", value: $branch, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Message", value: $message, inline: false},
                {name: "Triggered by", value: $actor, inline: true}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"

      - name: Send Discord notification (Failure)
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "[\`${COMMIT_SHA}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg message "${COMMIT_MESSAGE:0:1000}" \
            --arg run "[View Logs](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: "❌ Deployment Failed",
              description: "CPanel deployment to production has failed.",
              color: 15158332,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Branch", value: $branch, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Message", value: $message, inline: false},
                {name: "Workflow Run", value: $run, inline: true}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"

  notify-build-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Send Discord notification (Build Failed)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          SERVER_URL: ${{ github.server_url }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "[\`${COMMIT_SHA}\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})" \
            --arg message "${COMMIT_MESSAGE:0:1000}" \
            --arg run "[View Logs](${SERVER_URL}/${REPO}/actions/runs/${BUILD_RUN_ID})" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{
              title: "🔴 Docker Build Failed",
              description: "Docker image build has failed. Deployment skipped.",
              color: 15158332,
              fields: [
                {name: "Repository", value: $repo, inline: true},
                {name: "Branch", value: $branch, inline: true},
                {name: "Commit", value: $commit, inline: false},
                {name: "Message", value: $message, inline: false},
                {name: "Workflow Run", value: $run, inline: false}
              ],
              timestamp: $ts
            }]}' \
          | curl -sf -H "Content-Type: application/json" -X POST -d @- "$DISCORD_WEBHOOK"
