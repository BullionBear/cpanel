# Publishes ghcr.io/bullionbear/cpanel (C2-06). This workflow builds and pushes an image.
# It does not migrate and does not connect to a machine. Pushing main tags :main and the
# 12-character commit. Pushing a v* tag tags that name. /healthz commit matches the commit tag.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: vars
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=12 HEAD)
          version=$(git describe --tags --always --dirty --match='v[0-9]*.[0-9]*.[0-9]*')
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "built_at=$built_at"
            echo "tags<<EOF"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "ghcr.io/bullionbear/cpanel:${GITHUB_REF_NAME}"
            else
              echo "ghcr.io/bullionbear/cpanel:main"
              echo "ghcr.io/bullionbear/cpanel:${sha}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.sha }}
            BUILT_AT=${{ steps.vars.outputs.built_at }}

      - name: Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK is unset" >&2
            exit 1
          fi
          if [ -z "$DIGEST" ]; then
            echo "image digest is empty" >&2
            exit 1
          fi
          text=$(printf 'cpanel image published\n%s\n%s' "$DIGEST" "$TAGS")
          payload=$(jq -n --arg content "$text" '{content:$content}')
          code=$(curl -sS -o /tmp/discord-body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK")
          if [ "$code" != "204" ]; then
            echo "discord webhook status $code" >&2
            cat /tmp/discord-body >&2
            exit 1
          fi
