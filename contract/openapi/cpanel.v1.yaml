# cpanel-api 的對外契約（ARCHITECTURE §4.7）。SPA 不在這份契約裡。
# 0.2.1 的 /healthz 加上建置時間（C2-06）。0.2.0 加上 Discord 登入、session、bearer token（C2-04）。
openapi: 3.0.3
info:
  title: cpanel API
  version: 0.2.1
  description: |
    cpanel-api 的對外契約。

    錯誤一律是 `application/problem+json`（RFC 9457），另帶穩定的 `code`。`type` 一律是 `about:blank`。

    人用 Discord OAuth，cookie 是 `HttpOnly`、`Secure`、`SameSite=Strict`。程式用 bearer token，前綴是 `cpanel_`。
    帶了 `Authorization: Bearer` 的請求不使用 cookie。cookie 的寫入請求必須帶與伺服器設定相同的 `Origin`。
servers:
  - url: /
    description: cpanel-api，與 SPA 同源。
tags:
  - name: system
    description: 行程、就緒與指標。不需要認證。
  - name: auth
    description: Discord 登入、session 與 bearer token。
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      security: []
      summary: 行程是否在跑
      description: 只看這個行程。不連資料庫。回應帶建置版本、commit 與建置時間。
      responses:
        '200':
          description: 行程在跑。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      security: []
      summary: 能否接受工作
      description: 資料庫連得上，而且 schema 是目前嵌入的版本。否則 503。
      responses:
        '200':
          description: 資料庫與 schema 都可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: 資料庫連不上，或 schema 不是目前版本。`code` 是 `unavailable`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      security: []
      summary: Prometheus 指標
      description: Prometheus 的 text exposition。
      responses:
        '200':
          description: Prometheus text exposition。
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /auth/discord/login:
    get:
      tags: [auth]
      operationId: loginDiscord
      security: []
      summary: 轉向 Discord 登入
      description: |
        302 到 Discord。同時設下 `cpanel_oauth_state`（`HttpOnly`、`Secure`、`SameSite=Lax`，只送到 callback）。
        Discord 尚未設定時回 503。
      responses:
        '302':
          description: 轉向 Discord。
          headers:
            Location:
              required: true
              schema:
                type: string
        '503':
          description: Discord 尚未設定。`code` 是 `unavailable`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /auth/discord/callback:
    get:
      tags: [auth]
      operationId: callbackDiscord
      security: []
      summary: Discord 把瀏覽器送回來
      description: |
        核對 state，交換 code，確認 guild 與 role。成功時設下 `cpanel_session`
        （`HttpOnly`、`Secure`、`SameSite=Strict`）並轉向 `/`。不在 guild 或沒有 role 回 403，不建立 session。
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 已登入，轉向 `/`。
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          description: state 不符。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 不是指定 guild 的成員，或沒有指定的 role。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 登出
      description: 刪掉 session，清掉 cookie。cookie 登入的請求要帶對的 `Origin`。
      responses:
        '204':
          description: 已登出。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [auth]
      operationId: getMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 目前的登入者
      responses:
        '200':
          description: 登入者。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /tokens:
    get:
      tags: [auth]
      operationId: listTokens
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出自己尚未撤銷的 token
      description: 不回傳 token 明文。
      responses:
        '200':
          description: token 清單。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [auth]
      operationId: createToken
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 建立 token
      description: token 明文只在這個回應出現一次。cookie 登入的請求要帶對的 `Origin`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: 已建立。`token` 只出現這一次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          description: 名稱是空的。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /tokens/{id}:
    delete:
      tags: [auth]
      operationId: deleteToken
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 撤銷 token
      description: 撤銷後下一個帶這個 token 的請求被拒絕。cookie 登入的請求要帶對的 `Origin`。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已撤銷。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個 token，或已經撤銷。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cpanel_session
      description: |
        `HttpOnly`、`Secure`、`SameSite=Strict`。值是亂數。資料庫只存它的 SHA-256。
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        前綴是 `cpanel_`。資料庫只存 SHA-256。帶了這個標頭就不使用 cookie。
  responses:
    Problem:
      description: 未預期的錯誤。`code` 是 `internal`、`timeout` 或 `method_not_allowed`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 沒有通過認證，或 session／token 已撤銷。`code` 是 `unauthenticated`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok, version, commit, built_at]
      properties:
        ok:
          type: boolean
          description: 行程在跑時為 true。
        version:
          type: string
          description: 建置版本，來自 `git describe`。在 `v*` tag 上建置時與 image tag 相同。
        commit:
          type: string
          description: git commit 的前 12 碼。push `main` 時的 image tag 與這個值相同。
        built_at:
          type: string
          format: date-time
          description: 建置時間，UTC，RFC3339。
    Ready:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 資料庫連得上且 schema 是目前版本時為 true。
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457。`code` 是給程式判斷的穩定值。
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: 一律是 `about:blank`；分類看 `code`。
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            穩定的錯誤碼。這一版使用 `unavailable`、`timeout`、`internal`、`method_not_allowed`、`bad_request`、`unauthenticated`、`forbidden`、`not_found`。
    Me:
      type: object
      additionalProperties: false
      required: [auth, discord_user_id, username, display_name]
      properties:
        auth:
          type: string
          enum: [session, token]
        discord_user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    Token:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    TokenCreated:
      type: object
      additionalProperties: false
      required: [id, name, created_at, token]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: 明文只出現這一次。
