# cpanel-api 的對外契約（ARCHITECTURE §4.7）。SPA 不在這份契約裡。
# 0.7.0 加上交易所帳號與 kind（C5-01）。沒有 key，也不 join api_id。
# 0.6.0 的 mirror 狀態列出查不到的 scope UID（C4-05）。
# 0.5.0 的 mirror 狀態加上 SYM 表的 revision（C4-02）。
# 0.4.0 加上 mirror 的同步狀態（C4-01）。
# 0.3.0 加上 stream、job、job 歷史與恢復暫停（C3-05）。
# 0.2.1 的 /healthz 加上建置時間（C2-06）。0.2.0 加上 Discord 登入、session、bearer token（C2-04）。
openapi: 3.0.3
info:
  title: cpanel API
  version: 0.7.0
  description: |
    cpanel-api 的對外契約。

    錯誤一律是 `application/problem+json`（RFC 9457），另帶穩定的 `code`。`type` 一律是 `about:blank`。

    人用 Discord OAuth，cookie 是 `HttpOnly`、`Secure`、`SameSite=Strict`。程式用 bearer token，前綴是 `cpanel_`。
    帶了 `Authorization: Bearer` 的請求不使用 cookie。cookie 的寫入請求必須帶與伺服器設定相同的 `Origin`。
servers:
  - url: /
    description: cpanel-api，與 SPA 同源。
tags:
  - name: system
    description: 行程、就緒與指標。不需要認證。
  - name: auth
    description: Discord 登入、session 與 bearer token。
  - name: ops
    description: stream、未完成的 job、job 歷史與 mirror 狀態。要登入。
  - name: accounts
    description: 交易所帳號與啟用的 kind。要登入。這份契約沒有 key。
paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      security: []
      summary: 行程是否在跑
      description: 只看這個行程。不連資料庫。回應帶建置版本、commit 與建置時間。
      responses:
        '200':
          description: 行程在跑。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      security: []
      summary: 能否接受工作
      description: 資料庫連得上，而且 schema 是目前嵌入的版本。否則 503。
      responses:
        '200':
          description: 資料庫與 schema 都可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: 資料庫連不上，或 schema 不是目前版本。`code` 是 `unavailable`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /metrics:
    get:
      tags: [system]
      operationId: getMetrics
      security: []
      summary: Prometheus 指標
      description: Prometheus 的 text exposition。
      responses:
        '200':
          description: Prometheus text exposition。
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /auth/discord/login:
    get:
      tags: [auth]
      operationId: loginDiscord
      security: []
      summary: 轉向 Discord 登入
      description: |
        302 到 Discord。同時設下 `cpanel_oauth_state`（`HttpOnly`、`Secure`、`SameSite=Lax`，只送到 callback）。
        Discord 尚未設定時回 503。
      responses:
        '302':
          description: 轉向 Discord。
          headers:
            Location:
              required: true
              schema:
                type: string
        '503':
          description: Discord 尚未設定。`code` 是 `unavailable`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /auth/discord/callback:
    get:
      tags: [auth]
      operationId: callbackDiscord
      security: []
      summary: Discord 把瀏覽器送回來
      description: |
        核對 state，交換 code，確認 guild 與 role。成功時設下 `cpanel_session`
        （`HttpOnly`、`Secure`、`SameSite=Strict`）並轉向 `/`。不在 guild 或沒有 role 回 403，不建立 session。
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 已登入，轉向 `/`。
          headers:
            Location:
              required: true
              schema:
                type: string
        '400':
          description: state 不符。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 不是指定 guild 的成員，或沒有指定的 role。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 登出
      description: 刪掉 session，清掉 cookie。cookie 登入的請求要帶對的 `Origin`。
      responses:
        '204':
          description: 已登出。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me:
    get:
      tags: [auth]
      operationId: getMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 目前的登入者
      responses:
        '200':
          description: 登入者。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /tokens:
    get:
      tags: [auth]
      operationId: listTokens
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出自己尚未撤銷的 token
      description: 不回傳 token 明文。
      responses:
        '200':
          description: token 清單。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [auth]
      operationId: createToken
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 建立 token
      description: token 明文只在這個回應出現一次。cookie 登入的請求要帶對的 `Origin`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
      responses:
        '201':
          description: 已建立。`token` 只出現這一次。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
        '400':
          description: 名稱是空的。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /tokens/{id}:
    delete:
      tags: [auth]
      operationId: deleteToken
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 撤銷 token
      description: 撤銷後下一個帶這個 token 的請求被拒絕。cookie 登入的請求要帶對的 `Origin`。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 已撤銷。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個 token，或已經撤銷。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /streams:
    get:
      tags: [ops]
      operationId: listStreams
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出 stream
      description: |
        依 kind、lease key、狀態、錯誤類別篩。狀態由資料算出：有 `paused_reason` 是 `paused`，
        `consecutive_failures` 大於 0 是 `backing_off`，其餘是 `ok`。最多 500 筆，依 id 排序。
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/LeaseKey'
        - name: status
          in: query
          required: false
          description: 只留這個狀態。
          schema:
            $ref: '#/components/schemas/StreamStatus'
        - $ref: '#/components/parameters/ErrorClass'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: stream 清單。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stream'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /streams/{id}/resume:
    post:
      tags: [ops]
      operationId: resumeStream
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 恢復暫停的 stream
      description: |
        清掉 `paused_reason` 與 `paused_at`，並把 `next_due_at` 設成現在，下一輪才派得了工。
        本來就沒有暫停則原樣回傳，不寫 audit。有暫停才寫 `meta.audit`，action 是 `stream.resume`。
        cookie 登入的請求要帶對的 `Origin`。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 這個 stream 的目前狀態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個 stream。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /jobs:
    get:
      tags: [ops]
      operationId: listJobs
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出未完成的 job
      description: |
        只含 `pending` 與 `running`。錯誤類別用所屬 stream 的 `last_error_class`；沒有 stream 的 job 不會出現在錯誤類別篩選裡。
        最多 500 筆，依入隊時間排序。
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/LeaseKey'
        - name: status
          in: query
          required: false
          description: 只留這個狀態。
          schema:
            $ref: '#/components/schemas/JobStatus'
        - $ref: '#/components/parameters/ErrorClass'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: 未完成的 job。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /job-runs:
    get:
      tags: [ops]
      operationId: listJobRuns
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出已完成的 job
      description: |
        依完成時間新到舊。`cursor` 是上一頁的 `next_cursor`。`limit` 預設 50，最大 200。
      parameters:
        - name: from
          in: query
          required: false
          description: 含這個時間之後完成的。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 不含這個時間之後完成的。
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/LeaseKey'
        - name: status
          in: query
          required: false
          description: 只留這個狀態。
          schema:
            $ref: '#/components/schemas/JobRunStatus'
        - $ref: '#/components/parameters/ErrorClass'
        - name: limit
          in: query
          required: false
          description: 一頁幾筆。預設 50，最大 200。
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: 上一頁回的 `next_cursor`。不是這個格式則 `bad_request`。
          schema:
            type: string
      responses:
        '200':
          description: 一頁歷史。沒有下一頁時不帶 `next_cursor`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunPage'
        '400':
          description: cursor 無法解讀。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /mirror/status:
    get:
      tags: [ops]
      operationId: getMirrorStatus
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: mirror 各來源的同步狀態
      description: |
        每個 `mirror.sync_state` 一列。`last_error_class` 與 `last_error` 是這個來源對應的
        最近一次 job_run（`mftiko.*` 是 `mftiko.sync`，`sym` 與 `sym:*` 是 `sym.sync`）。
        最近一次成功時這兩個欄位是空的。
      responses:
        '200':
          description: 各來源的狀態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-accounts:
    get:
      tags: [accounts]
      operationId: listExchangeAccounts
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 列出未刪除的交易所帳號
      description: |
        軟刪除的帳號不在這份清單裡。每一筆帶上 kind 列，含已停用的。
        `verified_at` 與 `last_error` 這張票留空。不 join `api_id`，也沒有 unmatched。
      responses:
        '200':
          description: 未刪除的帳號，依 id 排序。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [accounts]
      operationId: createExchangeAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 建立交易所帳號
      description: |
        `exch_account_uid` 與 `label` 必填。同一對 `(exchange, exch_account_uid)` 再建立回 409，
        軟刪除之後也一樣。Bybit、OKX 沒帶 kind 時自動啟用該所唯一的 `in_scope` kind。
        Binance 不自動啟用；`kinds` 裡每一項都要屬於這個 exchange 且 `in_scope`。
        cookie 登入的請求要帶對的 `Origin`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeAccountCreate'
      responses:
        '201':
          description: 已建立。`revision` 是 1。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '400':
          description: 欄位不完整，或 kind 不屬於這個交易所、或不在範圍內。`code` 是 `bad_request`。沒有新列。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 這一對 `(exchange, exch_account_uid)` 已經存在，含已軟刪除的。`code` 是 `conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ExchangeAccountId'
    get:
      tags: [accounts]
      operationId: getExchangeAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 讀取一個交易所帳號
      description: 軟刪除的帳號仍用這個 id 查得到。形狀與列表的一筆相同。
      responses:
        '200':
          description: 這個帳號。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 沒有這個帳號。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [accounts]
      operationId: updateExchangeAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 修改帳號的 label
      description: |
        沒有改 uid 的 API。body 帶了 `exch_account_uid` 且與現值不同時回 400，`revision` 不加。
        label 有變才讓 `revision` 加 1，並寫 `meta.audit`。已軟刪除的帳號回 409。
        cookie 登入的請求要帶對的 `Origin`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeAccountUpdate'
      responses:
        '200':
          description: 更新後的帳號。沒有變更時 `revision` 不變。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '400':
          description: uid 與現值不同，或 label 是空的。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個帳號。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 帳號已軟刪除。`code` 是 `conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [accounts]
      operationId: deleteExchangeAccount
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 軟刪除交易所帳號
      description: |
        寫入 `deleted_at`。列還在，`(exchange, exch_account_uid)` 仍被佔住。`revision` 不加。
        已經刪除的再刪一次回同一筆，不再寫 audit。cookie 登入的請求要帶對的 `Origin`。
      responses:
        '200':
          description: 刪除後的帳號。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個帳號。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-accounts/{id}/kinds:
    parameters:
      - $ref: '#/components/parameters/ExchangeAccountId'
    post:
      tags: [accounts]
      operationId: enableExchangeAccountKind
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 啟用一個 kind
      description: |
        kind 必須屬於帳號的 exchange，且 `in_scope`。否則 400，不新增列。
        新列，或把停用列的 `disabled_at`、`verified_at`、`last_error` 清掉，`revision` 加 1。
        本來就啟用則原樣回傳，不加 revision、不寫 audit。已軟刪除的帳號回 409。
        cookie 登入的請求要帶對的 `Origin`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeAccountKindEnable'
      responses:
        '200':
          description: 這個帳號的目前狀態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '400':
          description: kind 不存在、不屬於這個交易所，或 `in_scope` 是 false。`code` 是 `bad_request`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個帳號。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 帳號已軟刪除。`code` 是 `conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /exchange-accounts/{id}/kinds/{kind}/disable:
    parameters:
      - $ref: '#/components/parameters/ExchangeAccountId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [accounts]
      operationId: disableExchangeAccountKind
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: 停用一個 kind
      description: |
        只寫 `disabled_at`，列留著。本來就停用則不加 revision、不寫 audit。
        沒有這列回 404。已軟刪除的帳號回 409。cookie 登入的請求要帶對的 `Origin`。
      responses:
        '200':
          description: 這個帳號的目前狀態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Origin 不符。`code` 是 `forbidden`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 沒有這個帳號，或這個 kind 沒有列。`code` 是 `not_found`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 帳號已軟刪除。`code` 是 `conflict`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Kind:
      name: kind
      in: query
      required: false
      description: 只留這個 kind。
      schema:
        type: string
    LeaseKey:
      name: lease_key
      in: query
      required: false
      description: 只留這個 lease key，例如 `account:1`。
      schema:
        type: string
    ErrorClass:
      name: error_class
      in: query
      required: false
      description: 只留這個錯誤類別。
      schema:
        $ref: '#/components/schemas/ErrorClass'
    ListLimit:
      name: limit
      in: query
      required: false
      description: 最多幾筆。預設 200，最大 500。
      schema:
        type: integer
        minimum: 1
        maximum: 500
    ExchangeAccountId:
      name: id
      in: path
      required: true
      description: pms.exchange_account.id。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cpanel_session
      description: |
        `HttpOnly`、`Secure`、`SameSite=Strict`。值是亂數。資料庫只存它的 SHA-256。
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        前綴是 `cpanel_`。資料庫只存 SHA-256。帶了這個標頭就不使用 cookie。
  responses:
    Problem:
      description: 未預期的錯誤。`code` 是 `internal`、`timeout` 或 `method_not_allowed`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 沒有通過認證，或 session／token 已撤銷。`code` 是 `unauthenticated`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok, version, commit, built_at]
      properties:
        ok:
          type: boolean
          description: 行程在跑時為 true。
        version:
          type: string
          description: 建置版本，來自 `git describe`。在 `v*` tag 上建置時與 image tag 相同。
        commit:
          type: string
          description: git commit 的前 12 碼。push `main` 時的 image tag 與這個值相同。
        built_at:
          type: string
          format: date-time
          description: 建置時間，UTC，RFC3339。
    Ready:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          description: 資料庫連得上且 schema 是目前版本時為 true。
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457。`code` 是給程式判斷的穩定值。
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: 一律是 `about:blank`；分類看 `code`。
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: |
            穩定的錯誤碼。這一版使用 `unavailable`、`timeout`、`internal`、`method_not_allowed`、`bad_request`、`unauthenticated`、`forbidden`、`not_found`。
    Me:
      type: object
      additionalProperties: false
      required: [auth, discord_user_id, username, display_name]
      properties:
        auth:
          type: string
          enum: [session, token]
        discord_user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
    TokenCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    Token:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
    TokenCreated:
      type: object
      additionalProperties: false
      required: [id, name, created_at, token]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        token:
          type: string
          description: 明文只出現這一次。
    ErrorClass:
      type: string
      description: 錯誤類別（C3-04）。
      enum: [auth, rate_limited, ip_banned, unavailable, bad_request, not_found, internal]
    StreamStatus:
      type: string
      description: 有 `paused_reason` 是 `paused`；否則連續失敗大於 0 是 `backing_off`；其餘是 `ok`。
      enum: [ok, backing_off, paused]
    JobStatus:
      type: string
      enum: [pending, running]
    JobRunStatus:
      type: string
      enum: [succeeded, failed, cancelled]
    MirrorStatus:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/MirrorSource'
        unresolved_uids:
          type: array
          description: scope 指到、還沒寫進 `mirror.symbol` 的 UID，以及查過幾次（C4-05）。沒有時是空陣列。
          items:
            $ref: '#/components/schemas/UnresolvedUid'
    UnresolvedUid:
      type: object
      additionalProperties: false
      required: [uid, attempts, last_result]
      properties:
        uid:
          type: integer
          format: int64
        attempts:
          type: integer
          format: int64
        last_result:
          type: string
          description: "`not_found` 是 SYM 沒有這個 UID。`unparsable` 是 `universal_ticker` 拆不出 venue 與 category。"
        first_tried_at:
          type: string
          format: date-time
        last_tried_at:
          type: string
          format: date-time
    MirrorSource:
      type: object
      additionalProperties: false
      required: [source, unavailable_regions]
      properties:
        source:
          type: string
          description: 例如 `mftiko.accounts`。
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_ok_at:
          type: string
          format: date-time
          nullable: true
        last_complete_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: integer
          format: int64
          nullable: true
          description: 這一輪讀到的筆數。SYM 的表是 mirror 裡的列數。
        revision:
          type: integer
          format: int64
          nullable: true
          description: 這張 SYM 表已載入的 revision。其他來源是空的。
        remote_revision:
          type: integer
          format: int64
          nullable: true
          description: SYM 上這張表的 revision。
        unavailable_regions:
          type: array
          items:
            type: string
        last_error_class:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
    Stream:
      type: object
      additionalProperties: false
      required: [id, kind, lease_key, key, status, next_due_at, consecutive_failures, created_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        lease_key:
          type: string
        key:
          type: string
        status:
          $ref: '#/components/schemas/StreamStatus'
        paused_reason:
          type: string
          nullable: true
        paused_at:
          type: string
          format: date-time
          nullable: true
        next_due_at:
          type: string
          format: date-time
        last_ok_at:
          type: string
          format: date-time
          nullable: true
        consecutive_failures:
          type: integer
        last_error_class:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Job:
      type: object
      additionalProperties: false
      required: [id, kind, dedup_key, lease_key, status, attempt, not_before, enqueued_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        dedup_key:
          type: string
        lease_key:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        attempt:
          type: integer
        not_before:
          type: string
          format: date-time
        enqueued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        stream_id:
          type: integer
          format: int64
          nullable: true
        last_error_class:
          type: string
          nullable: true
          description: 所屬 stream 的 `last_error_class`。沒有 stream 時是 null。
    JobRun:
      type: object
      additionalProperties: false
      required: [id, kind, dedup_key, lease_key, status, attempt, requests, items, more, enqueued_at, finished_at]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        dedup_key:
          type: string
        lease_key:
          type: string
        stream_id:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/JobRunStatus'
        attempt:
          type: integer
        requests:
          type: integer
        items:
          type: integer
        more:
          type: boolean
        error_class:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        enqueued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
        worker:
          type: string
          nullable: true
    JobRunPage:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/JobRun'
        next_cursor:
          type: string
          description: 還有下一頁時才有。原樣傳回 `cursor`。
    Exchange:
      type: string
      enum: [binance, bybit, okx]
    ExchangeAccountKind:
      type: object
      additionalProperties: false
      required: [kind, disabled_at, verified_at, last_error]
      properties:
        kind:
          type: string
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: 有值表示這個 kind 已停用。列還在。
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: C5-03 才寫。這張票留空，再啟用時清掉。
        last_error:
          type: string
          nullable: true
          description: C5-03 才寫。這張票留空，再啟用時清掉。
    ExchangeAccount:
      type: object
      additionalProperties: false
      required: [id, exchange, exch_account_uid, label, revision, deleted_at, kinds]
      properties:
        id:
          type: integer
          format: int64
        exchange:
          $ref: '#/components/schemas/Exchange'
        exch_account_uid:
          type: string
        label:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        deleted_at:
          type: string
          format: date-time
          nullable: true
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeAccountKind'
    ExchangeAccountCreate:
      type: object
      additionalProperties: false
      required: [exchange, exch_account_uid, label]
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        exch_account_uid:
          type: string
        label:
          type: string
        kinds:
          type: array
          description: 省略或空陣列時，Bybit、OKX 自動啟用唯一的 in_scope kind；Binance 不啟用任何 kind。
          items:
            type: string
    ExchangeAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        exch_account_uid:
          type: string
          description: 與現值不同則整筆回 400。沒有改 uid 的 API。
    ExchangeAccountKindEnable:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
