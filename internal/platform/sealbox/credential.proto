syntax = "proto3";

package cpanel.sealbox.v1;

option go_package = "github.com/BullionBear/cpanel/internal/platform/sealbox;sealbox";

// ExchangeCredentials is the plaintext inside a sealed box (ARCHITECTURE §4.8).
// It exists only in memory while sealing or opening. It is not a stored column and it is not logged.
// exchange_account_id and credential_id are checked again after opening, because a sealed box has no
// associated data.
message ExchangeCredentials {
  int64 exchange_account_id = 1;
  int64 credential_id = 2;
  string api_key = 3;
  string api_secret = 4;
  string passphrase = 5;
}
